name: Windows build and validation

# Builds the console on a real Windows machine, runs every test suite (including the Windows-only
# tests that are skipped on Linux), publishes the portable single-file executable, and validates the
# published executable against the runner's real Windows installation.

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # The runner is disposable: allow the tests that change and then restore real Windows settings.
      SOFTRESET_ALLOW_SYSTEM_CHANGES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Windows version
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          whoami /groups | Select-String "High Mandatory Level"

      - name: Build
        run: dotnet build SoftReset.sln -c Release

      - name: Test (core, UI, and Windows-only suites)
        shell: pwsh
        env:
          SOFTRESET_SCREENSHOTS: ${{ github.workspace }}\artifacts\ui-screenshots
        run: dotnet test SoftReset.sln -c Release --no-build --logger "trx" --logger "console;verbosity=normal" --results-directory artifacts/test-results

      - name: Publish portable executable
        run: dotnet publish src/SoftReset.App/SoftReset.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/SoftResetConsole

      - name: Self-test of the published executable (read-only)
        shell: pwsh
        run: |
          $out = Join-Path $pwd "artifacts/self-test"
          $p = Start-Process -FilePath "artifacts/SoftResetConsole/SoftResetConsole.exe" -ArgumentList "--self-test", "`"$out`"" -Wait -PassThru
          Get-Content (Join-Path $out "self-test.log")
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Open every page of the published executable and capture it
        shell: pwsh
        run: |
          $out = Join-Path $pwd "artifacts/windows-screenshots"
          $data = Join-Path $pwd "artifacts/capture-data"
          $p = Start-Process -FilePath "artifacts/SoftResetConsole/SoftResetConsole.exe" -ArgumentList "--capture-pages", "`"$out`"", "--data", "`"$data`"" -Wait -PassThru
          Get-Content (Join-Path $out "capture-log.txt")
          if ($p.ExitCode -ne 0) { throw "Page capture failed with exit code $($p.ExitCode)" }

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            artifacts/test-results
            artifacts/self-test
            artifacts/windows-screenshots
            artifacts/ui-screenshots
          if-no-files-found: warn

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: SoftResetConsole-win-x64
          path: artifacts/SoftResetConsole
